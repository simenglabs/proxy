name: check proxies

# Fallback runner. The main scheduler is a cron on the LAN server (see README).
on:
  workflow_dispatch: # "Run sekarang" button on the monitor page

concurrency:
  group: check-proxies
  cancel-in-progress: false # queue at most one extra run, never overlap

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/check.ts
        env:
          SYNC_URL: ${{ secrets.SYNC_URL }}
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
